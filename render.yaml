# Render Blueprint: four static sites built from this one repo.
# Render dashboard → New → Blueprint → choose this repository → Apply.
#
# Each site builds a different edition (see src/config/edition.ts).
# If Render gives a site a different URL than the one below, update that site's
# VITE_SITE_URL in its Environment tab and redeploy, so the WhatsApp preview
# image points at the right address.

services:
  # 1. Full invitation: all three days
  - type: web
    runtime: static
    name: hasher-weds-samar
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SITE_URL
        value: https://hasher-weds-samar.onrender.com

  # 2. Nikkah only
